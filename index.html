<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b101c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Controle privado e offline dos seus turnos de freelance, horas e pagamentos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turno">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Turno — controle de freelas</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Turno, controle de freelas">
        <div class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><div class="brand-name">turno<span class="brand-dot">.</span></div><div class="brand-label">SEU CONTROLE DE FREELAS</div></div>
      </div>
      <button class="icon-button" type="button" data-action="help" aria-label="Ajuda e instalação"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 4"/><path d="M12 17h.01"/></svg></button>
    </header>
    <main id="screen" tabindex="-1" aria-live="polite">
      <div class="loading"><span class="loader"></span><p>Preparando seu controle…</p></div>
    </main>
    <footer class="footer-note">Seus dados ficam neste aparelho. <span class="footer-star">✳</span></footer>
  </div>
  <nav class="bottom-nav" aria-label="Navegação principal" id="bottomNav">
    <button type="button" data-tab="hoje" class="nav-button is-active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg></span><span>Início</span></button>
    <button type="button" data-tab="historico" class="nav-button"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h5"/></svg></span><span>Histórico</span></button>
    <button type="button" data-tab="locais" class="nav-button"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 12h16"/></svg></span><span>Locais</span></button>
    <button type="button" data-tab="ajustes" class="nav-button"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 1.1 1.9-2 2-1.9-1.1a8 8 0 0 1-2.2.9l-.5 2.2h-2.8l-.5-2.2a8 8 0 0 1-2.2-.9l-1.9 1.1-2-2L5.6 15a8 8 0 0 1-.9-2.2L2.5 12v-2.8l2.2-.5a8 8 0 0 1 .9-2.2L4.5 4.6l2-2 1.9 1.1a8 8 0 0 1 2.2-.9l.5-2.2h2.8l.5 2.2a8 8 0 0 1 2.2.9l1.9-1.1 2 2-1.1 1.9a8 8 0 0 1 .9 2.2l2.2.5V12l-2.2.8a8 8 0 0 1-.9 2.2Z" transform="translate(0 1) scale(.94)"/></svg></span><span>Ajustes</span></button>
  </nav>
  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite" class="toast"></div>
  <input id="fileImport" type="file" accept="application/json,.json" hidden>
  <script src="app.js" defer></script>
</body>
</html>
